[package]
name = "bevy_spatial_egui"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15"
bevy_egui = { branch = "fix_egui30", git = "https://github.com/MiniMinerX/bevy_egui.git", feature = ["render"] }
bevy-suis = { git = "https://github.com/MiniMinerX/bevy-suis.git", branch = "dev-bevy-0.15" }
wgpu-types = { version = "23.0"}

[dev-dependencies]
bevy_panorbit_camera = "0.21"
bevy_mod_openxr = { git = "https://github.com/MiniMinerX/bevy_oxr.git", branch = "dev/bevy-0.15.0"}
bevy_xr_utils = { git = "https://github.com/MiniMinerX/bevy_oxr.git", branch = "dev/bevy-0.15.0"}

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
